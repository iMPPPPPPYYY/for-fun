
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouse Parallax</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main id="scene">
    <img id="backdrop" src="./image.jpg" alt="">
    <img id="photo" src="./image.jpg" alt="场景">

    <div id="shade"></div>

<div id="enter-marker" role="button" aria-label="进入隐藏房间" tabindex="0">
  <div class="enter-label" data-text="ENTER">ENTER</div>

  <svg class="sketch-arrow" viewBox="0 0 160 150"
       xmlns="http://www.w3.org/2000/svg">
    <g class="arrow-line">
      <!-- 伪3D箭头顶部 -->
      <path d="M80 12 L133 42 L80 72 L27 42 Z"/>
      <path d="M80 12 L80 72"/>
      <path d="M27 42 L80 57 L133 42"/>

      <!-- 向下延伸的箭头杆 -->
      <path d="M80 57 L80 111"/>
      <path d="M72 103 L80 114 L88 103"/>

      <!-- 素描补线 -->
      <path d="M76 15 L130 44 L79 75"/>
      <path d="M30 44 L79 60"/>
      <path d="M76 62 L76 109"/>
      <path d="M84 64 L84 106"/>
      <path d="M68 101 L79 118 L92 101"/>
    </g>
  </svg>
  <div class="marker-grain"></div>
</div>

<div id="film-grain"></div>
<div id="scanlines"></div>
<div id="glitch-flash"></div>


<!-- 隐藏房间 -->
<div id="room-view">
  <img id="room-image" src="./dark.jpg" alt="隐藏房间里的照片">

  <div id="room-shade"></div>

  <!-- 点击图片后出现的乱码文字 -->
  <div id="room-word" aria-live="polite"></div>

  <!-- 第20次点击触发的红色提示 -->
  <div id="room-warning">
    You can NOT find the xxxxxx here
  </div>

  <button id="room-exit" type="button">← LEAVE ROOM</button>
</div>


    <div id="intro">
      <div class="eyebrow">INTERACTIVE SCENE</div>
      <h1>Enter the World</h1>
      <p>移动鼠标，感受空间</p>
      <button id="start">进入场景</button>
      <p class="hint">SHIFT · 切换鼠标锁定</p>
    </div>

    <div id="status">点击进入</div>
  </main>
<!-- 白色圆点鼠标 -->
<div id="white-dot-cursor" style="
  position: fixed;
  left: 0;
  top: 0;
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 2147483647;
  transform: translate(-50%, -50%);
"></div>

<script>
(() => {
  const dot = document.getElementById("white-dot-cursor");

  document.addEventListener("mousemove", (event) => {
    dot.style.left = event.clientX + "px";
    dot.style.top = event.clientY + "px";
  });
})();
</script>
<div id="horror-ending" aria-hidden="true">
  <div id="horror-message">
    <span class="horror-fixed">YOU CANNOT FIND </span><span id="horror-glitch">XXX</span>
  </div>
  <div id="horror-flash"></div>
</div>

</body>
</html>
